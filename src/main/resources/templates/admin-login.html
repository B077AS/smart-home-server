<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/icons.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/icon.svg}" />
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <img th:src="@{/icon.svg}" alt="Smart Home" class="logo-icon">
            <h1>Smart Home Admin</h1>
            <p>Control Panel Access</p>
        </div>

        <form th:action="@{/admin/login}" method="post" class="login-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:if="${error}" class="alert alert-error">
                <i class="mdi mdi-alert-circle alert-icon"></i>
                <span th:text="${error}">Invalid username or password</span>
            </div>

            <div th:if="${success}" class="alert alert-success">
                <i class="mdi mdi-check-circle alert-icon"></i>
                <span th:text="${success}">You have been logged out successfully</span>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="mdi mdi-account input-icon"></i>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="mdi mdi-lock input-icon"></i>
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="mdi mdi-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <span>Sign In</span>
                <i class="mdi mdi-arrow-right btn-arrow"></i>
            </button>
        </form>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('mdi-eye');
            eyeIcon.classList.add('mdi-eye-off');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('mdi-eye-off');
            eyeIcon.classList.add('mdi-eye');
        }
    }
</script>
</body>
</html>
