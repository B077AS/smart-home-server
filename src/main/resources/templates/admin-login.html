<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="purple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
  <link rel="stylesheet" th:href="@{/css/icons.css}">
  <link rel="icon" type="image/svg+xml" th:href="@{/icon.svg}">
</head>
<body class="login-page">

<div class="login-box">
  <div class="login-brand">
    <img th:src="@{/icon.svg}" alt="" class="login-logo">
    <div>
      <div class="login-name">Smart Home</div>
      <div class="login-sub">Admin Panel</div>
    </div>
  </div>

  <div th:if="${error}" class="flash flash-err">
    <i class="mdi mdi-alert-circle"></i>
    <span th:text="${error}"></span>
  </div>
  <div th:if="${success}" class="flash flash-ok">
    <i class="mdi mdi-check-circle"></i>
    <span th:text="${success}"></span>
  </div>

  <form th:action="@{/admin/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" onclick="togglePw()">
          <i class="mdi mdi-eye" id="pw-eye"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-login">Sign In</button>
  </form>
</div>

<div class="login-footer">
  <div class="theme-switcher">
    <button class="theme-dot" data-t="purple" onclick="setTheme('purple')"></button>
    <button class="theme-dot" data-t="blue"   onclick="setTheme('blue')"></button>
    <button class="theme-dot" data-t="green"  onclick="setTheme('green')"></button>
    <button class="theme-dot" data-t="red"    onclick="setTheme('red')"></button>
  </div>
</div>

<script>
  (function () {
    const t = localStorage.getItem('theme') || 'purple';
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.t === t));
  })();

  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    localStorage.setItem('theme', t);
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.t === t));
  }

  function togglePw() {
    const inp = document.getElementById('password');
    const eye = document.getElementById('pw-eye');
    const hide = inp.type === 'password';
    inp.type = hide ? 'text' : 'password';
    eye.className = hide ? 'mdi mdi-eye-off' : 'mdi mdi-eye';
  }
</script>
</body>
</html>
