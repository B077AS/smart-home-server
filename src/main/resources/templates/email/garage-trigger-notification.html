<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Door Triggered</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #F5F5F5;">
<table role="presentation" style="width: 100%; border-collapse: collapse;">
    <tr>
        <td style="padding: 40px 20px;">
            <table role="presentation" style="max-width: 800px; margin: 0 auto; background-color: #FFFFFF; border-radius: 16px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15); overflow: hidden;">

                <!-- Header -->
                <tr>
                    <td style="background: linear-gradient(135deg, #E65100 0%, #BF360C 100%); padding: 40px; text-align: center; border-radius: 16px 16px 0 0;">
                        <h1 style="margin: 0; color: #FFFFFF; font-size: 28px; font-weight: 600;">Garage Door Triggered</h1>
                        <p style="margin: 8px 0 0 0; color: #FFCCBC; font-size: 16px;">Activity Alert — Smart Home System</p>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding: 40px;">
                        <p style="margin: 0 0 32px 0; color: #212121; font-size: 16px; line-height: 1.6;">
                            The garage door was triggered. Please review the details below:
                        </p>

                        <!-- Details Card -->
                        <table role="presentation" style="width: 100%; background-color: #F5F5F5; border-radius: 8px; padding: 24px; margin-bottom: 32px;">
                            <tr>
                                <td>
                                    <table role="presentation" style="width: 100%;">
                                        <tr>
                                            <td style="padding: 12px 0;">
                                                <p style="margin: 0; color: #757575; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Triggered By</p>
                                                <p style="margin: 4px 0 0 0; color: #212121; font-size: 16px; font-weight: 600;">${triggeredBy}</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="padding: 12px 0;">
                                                <div style="height: 1px; background-color: #E0E0E0;"></div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="padding: 12px 0;">
                                                <p style="margin: 0; color: #757575; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Timestamp</p>
                                                <p style="margin: 4px 0 0 0; color: #212121; font-size: 16px; font-weight: 600;">${timestamp}</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="padding: 12px 0;">
                                                <div style="height: 1px; background-color: #E0E0E0;"></div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td style="padding: 12px 0;">
                                                <p style="margin: 0; color: #757575; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">IP Address</p>
                                                <p style="margin: 4px 0 0 0; color: #212121; font-size: 16px; font-weight: 600;">${ipAddress}</p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding: 24px 40px; border-top: 1px solid #E0E0E0;">
                        <p style="margin: 0 0 8px 0; color: #757575; font-size: 13px; line-height: 1.6; text-align: center;">
                            Smart Home Security System
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
